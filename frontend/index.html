<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelForge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Crect x='10' y='6' width='12' height='20' rx='2' fill='none' stroke='%235ac8fa' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%235ac8fa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="shell-root">
    <nav class="activity-bar" aria-label="视图切换">
      <button type="button" class="activity-icon" data-view="device" aria-label="设备" title="设备">📱</button>
      <button type="button" class="activity-icon" data-view="image" aria-label="图片处理" title="图片处理">🖼</button>
      <button type="button" class="activity-icon" data-view="assets" aria-label="资源" title="资源">🗂</button>
      <button type="button" class="activity-icon" data-view="flow" aria-label="实验本" title="实验本（规划中）">🧪</button>
      <button type="button" class="activity-icon" data-view="flow-demo" aria-label="功能流程测试" title="功能流程测试（开发中）">🎬</button>
      <div class="activity-spacer"></div>
    </nav>
    <main class="shell-main">
      <iframe id="view-frame" class="view-frame" title="PixelForge"></iframe>
    </main>
  </div>
  <script type="module" src="shell.js"></script>
</body>
</html>
